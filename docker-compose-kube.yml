services:
  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - autodealer
        
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.2
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.2.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_BROKER_ID=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    networks:
      - kafka
  
  postgres_user:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Autodealer
    ports:
      - "50001:5432"
    networks:
      - autodealer
    volumes:
      - postgres_data:/var/lib/postgresql/data
        
  mongo_autodealer:
    image: mongo
    volumes:
      - mongo_data:/data/db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Autodealer
    networks:
      - autodealer
        
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      autodealer:
    ports:
      - "9090:9090"

  grafana:
      image: grafana/grafana:latest
      ports:
        - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=
      networks:
        autodealer:
      volumes:
        - ./grafana/provisioning:/etc/grafana/provisioning
        - ./grafana/provisioning/dashboards-json:/var/lib/grafana/dashboards-json

  jaeger:
      image: jaegertracing/all-in-one:1.47
      networks:
        autodealer:
      ports:
        - "16686:16686"
        - "6831:6831/udp"
      
networks:
  kafka:
  autodealer:
    driver: bridge
    
volumes:
  postgres_data:
  mongo_data: