global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'apigateway'
    static_configs:
      - targets: ['host.docker.internal:8083']
    metrics_path: /metrics

  - job_name: 'autodealer'
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: /metrics
    
  - job_name: 'usercore'
    static_configs:
      - targets: [ 'host.docker.internal:8082' ]
    metrics_path: /metrics